server:
  port: ${PORT:8080}
  servlet:
    context-path: /journal

spring:
  mongodb:
    uri: ${MONGODB_URI}
    database: ${MONGODB_DATABASE:journaldb}
  data:
    mongodb:
      auto-index-creation: true
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

journal:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

weather:
  api:
    key: ${WEATHER_API_KEY:}
